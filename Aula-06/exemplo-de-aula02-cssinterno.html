<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudando Classes com CSS</title>

    <style>
        .titulo{
            color: darkblue;
            text-align: center;
        }
        .primeira-div{
            background-color: lightskyblue;
            border: 2px solid lightseagreen;
            padding: 20px;
            margin: 20px;
        }
        .segunda-div{
            background-color: lightpink;
            border: 2px solid palevioletred;
            padding: 20px;
            margin: 20px;
        }
    </style>
</head>

<body>

    <h1 class="titulo">Estudando Classes com CSS</h1>

    <div class="primeira-div">
        <p class="paragrafo">Este é o primeiro parágrafo da primeira div.</p>
        <p class="paragrafo">Este é o segundo parágrafo da primeira div.</p>
    </div>

    <div class="segunda-div">
        <p class="paragrafo">Este é o único parágrafo da segunda div.</p>
    </div>

</body>
</html>
