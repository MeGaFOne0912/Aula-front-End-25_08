<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript no head e no body</title>
    <style>
        .destaque{
           color: blue;
           font-size: 30px;
           font-weight: bold; 
        }

    </style>
    
    <script>
        alert("OIOI FLOR LINDA! O JAVASCRIPT DO CABEÇALHO FOI EXECUTADO!");

    </script>
</head>
<body>
    <h1>
        Javascript incorporado
    </h1>
    <p>
        Este conteudo foi escrito diretamente com HTML
    </p>
    <script>
        document.write('<p class="destaque">Este conteudo foi criado pelo javascript</p>')
    </script>

</body>
</html>
