<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panelas</title>
</head>
<body>
    <h1>Tabelas em HTML.</h1>
    <p>
        As tabelas em HTML são usadas para organizar<br> 
        dados em linhas e colunas 
    </p>
    <br>
    <hr>
    <br>
    <table border = "2">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Idade</th>
                <th>Cidade</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Bruno</td>
                <td>30</td>
                <td>Rio de Janeiro</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
